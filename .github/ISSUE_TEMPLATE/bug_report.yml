name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS / device
      placeholder: macOS 15.5, Apple silicon
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines of `~/.orc/orcd.log`. Remove anything private.
      render: text
