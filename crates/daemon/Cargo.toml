[package]
name = "orc-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orcd"
path = "src/main.rs"

[[bin]]
name = "orc-statusline"
path = "src/bin/orc-statusline.rs"

[[bin]]
name = "orc-commit-check"
path = "src/bin/orc-commit-check.rs"

[[bin]]
name = "orc-mcp"
path = "src/bin/orc-mcp.rs"

[[bin]]
name = "orc-hook"
path = "src/bin/orc-hook.rs"

[dependencies]
base64 = "0.22.1"
toml = "0.8.23"
orc-protocol.workspace = true
orc-link.workspace = true
iroh.workspace = true
serde.workspace = true
serde_json.workspace = true
alacritty_terminal = "0.26.0"
uuid = { version = "1.29.0", features = ["v4"] }
portable-pty = "0.9.0"
ignore = "0.4.34"
regex = "1.13.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
qrcode = { version = "0.14.1", default-features = false }
turso = "=0.8.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"
