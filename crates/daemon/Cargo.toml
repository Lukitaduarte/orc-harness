[package]
name = "orc-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orcd"
path = "src/main.rs"

[[bin]]
name = "orc-statusline"
path = "src/bin/orc-statusline.rs"

[[bin]]
name = "orc-hook"
path = "src/bin/orc-hook.rs"

[dependencies]
orc-protocol.workspace = true
orc-link.workspace = true
iroh.workspace = true
serde.workspace = true
serde_json.workspace = true
alacritty_terminal = "0.26.0"
uuid = { version = "1.29.0", features = ["v4"] }
portable-pty = "0.9.0"
tokio.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
